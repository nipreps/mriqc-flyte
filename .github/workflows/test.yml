name: Lint and test

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Read the ruff version pinned in pyproject.toml (the dev container's)
        run: echo "RUFF=$(grep -oE '"ruff == [0-9.]+"' pyproject.toml | tr -d '" ')" >> "$GITHUB_ENV"
      - run: pipx run --spec "$RUFF" ruff format --diff
      - run: pipx run --spec "$RUFF" ruff check

  test:
    # Unit tests only: tests marked `baseline` or `binaries` run in the dev container.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.11 is the dev container's Python
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (CPU-only torch keeps the download small)
        run: |
          python -m pip install -U pip
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu ".[test]"
      - name: Run tests
        run: python -m pytest -m "not baseline and not binaries" --cov --cov-report=term
