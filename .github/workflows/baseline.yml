name: Baseline

# Runs standard MRIQC twice on the test T1w (circle-tests sub-50137) in the dev container and
# compares the two runs: seed checks (#7) and noise floor (#8). A manual run with `publish` set
# uploads the result as a pre-release, which is what MRIQC_FLYTE_BASELINE points to.
on:
  workflow_dispatch:
    inputs:
      image:
        description: Dev container image
        default: ghcr.io/nipreps/mriqc-flyte:dev
      publish:
        description: Publish the baseline as a pre-release
        type: boolean
        default: false
  pull_request:
    branches: ['main']
    paths:
      - '.github/workflows/baseline.yml'
      - '.maint/compare_baseline_runs.py'

permissions:
  # Publishing creates a tag and a release
  contents: write

env:
  IMAGE: ${{ inputs.image || 'ghcr.io/nipreps/mriqc-flyte:dev' }}
  PARTICIPANT: '50137'
  # MRIQC's CI dataset (as in its .circleci/config.yml)
  DATASET: https://files.osf.io/v1/resources/fvuh8/providers/osfstorage/5b6c9950fed49e001a7885b6

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space (the dev container is about 20 GB unpacked)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
            /usr/local/share/boost
          docker system prune -af
          df -h /

      - name: Pull the dev container
        run: |
          docker pull "$IMAGE"
          docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE"

      - name: Prepare the BIDS dataset (one participant) and the nipype configuration
        run: |
          mkdir -p "$RUNNER_TEMP/dl" baseline/bids baseline/nipype
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/dl/circle-tests.tar.gz" "$DATASET"
          tar -xzf "$RUNNER_TEMP/dl/circle-tests.tar.gz" -C "$RUNNER_TEMP/dl"
          src="$RUNNER_TEMP/dl/circle-tests"
          cp "$src/dataset_description.json" "$src/README" "$src/CHANGES" baseline/bids/
          cp -r "$src/sub-$PARTICIPANT" baseline/bids/
          # Keep every node's outputs, so that each step can be tested on its own
          printf '[execution]\nremove_unnecessary_outputs = false\n' > baseline/nipype/nipype.cfg

      - name: Run MRIQC twice
        run: |
          # Side by side on runners with 16 GB (public repositories), one after the other on
          # smaller ones (private forks), to stay within memory
          mem_gb=$(free -g | awk '/^Mem:/ {print $2}')
          echo "$(nproc) CPUs, $mem_gb GB"
          finish() {
            code=$(docker wait "run-$1")
            docker logs "run-$1" > "baseline/run-$1/mriqc.log" 2>&1
            echo "run-$1 exited with $code"
            [[ "$code" == 0 ]] || { tail -50 "baseline/run-$1/mriqc.log"; return 1; }
          }
          status=0
          for i in 1 2; do
            mkdir -p "baseline/run-$i"
            docker run -d --name "run-$i" -u "$(id -u):$(id -g)" \
              -v "$PWD/baseline:/baseline" -v "$PWD/baseline/nipype:/home/mriqc/.nipype:ro" \
              -e ANTS_RANDOM_SEED=42 "$IMAGE" \
              mriqc /baseline/bids "/baseline/run-$i/out" participant \
                --participant-label "$PARTICIPANT" -m T1w --omp-nthreads 1 --nprocs 2 \
                --no-sub --notrack -w "/baseline/run-$i/work"
            if (( mem_gb < 14 )); then finish "$i" || status=1; fi
          done
          if (( mem_gb >= 14 )); then
            for i in 1 2; do finish "$i" || status=1; done
          fi
          exit $status

      - name: Check the files the issues rely on
        run: |
          find baseline/run-1/work -name result_pre_n4.pklz | grep .
          find baseline/run-1/out -name "sub-${PARTICIPANT}_T1w.json" | grep .

      - name: Compare the runs
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo:ro" -v "$PWD/baseline:/baseline" \
            "$IMAGE" python /repo/.maint/compare_baseline_runs.py /baseline/run-1 /baseline/run-2 \
            --atropos-check /tmp/atropos > report.md
          # The versions the dev image recorded at build time
          docker run --rm "$IMAGE" cat /opt/mriqc-flyte/versions.json > baseline/versions.json
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE")
          { cat report.md; echo; echo '## Versions'; echo; echo "Image: \`$digest\`"; echo
            echo '```json'; cat baseline/versions.json; echo '```'; } \
            | tee -a "$GITHUB_STEP_SUMMARY" > notes.md

      - name: Package
        run: |
          cp notes.md baseline/report.md
          tar -czf bids.tar.gz -C baseline bids
          for i in 1 2; do tar -czf "run-$i.tar.gz" -C baseline "run-$i"; done
          sha256sum bids.tar.gz run-1.tar.gz run-2.tar.gz > SHA256SUMS
          ls -la ./*.tar.gz
          # Release assets must stay under 2 GB each
          find . -maxdepth 1 -name '*.tar.gz' -size +1900M | (! grep .)

      - uses: actions/upload-artifact@v4
        with:
          name: baseline-report
          path: |
            notes.md
            SHA256SUMS

      - name: Publish the pre-release
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(grep -oE 'mriqc\.git@[0-9a-f]{40}' pyproject.toml | cut -d@ -f2)
          tag="baseline-t1w-${sha:0:8}"
          # The tag points to a commit outside main's history, so that `git describe` on main
          # (hatch-vcs versions) never sees it.
          readme="Baseline for mriqc-flyte: standard MRIQC (nipreps/mriqc@${sha:0:8}) run twice on circle-tests sub-$PARTICIPANT. See the release notes."
          tree=$(gh api "repos/$GITHUB_REPOSITORY/git/trees" -f 'tree[][path]=README.md' \
            -f 'tree[][mode]=100644' -f 'tree[][type]=blob' -f "tree[][content]=$readme" --jq .sha)
          commit=$(gh api "repos/$GITHUB_REPOSITORY/git/commits" -f "message=$tag" -f "tree=$tree" \
            --jq .sha)
          gh release create "$tag" --target "$commit" --prerelease \
            --title "Baseline: MRIQC on the test T1w (sub-$PARTICIPANT, mriqc@${sha:0:8})" \
            --notes-file notes.md bids.tar.gz run-1.tar.gz run-2.tar.gz SHA256SUMS
