name: Dev container

# Builds the dev container (see Dockerfile and docker-bake.hcl). Pull requests only build it;
# pushes to main and manual runs also publish it to the GitHub Container Registry.
on:
  push:
    branches: ['main']
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-bake.hcl'
      - '.maint/image_versions.py'
      - 'pyproject.toml'
      - '.github/workflows/docker.yml'
  pull_request:
    branches: ['main']
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-bake.hcl'
      - '.maint/image_versions.py'
      - 'pyproject.toml'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - name: Read the MRIQC release pinned in pyproject.toml
        id: pin
        run: |
          version=$(grep -oE '"mriqc == [0-9.]+"' pyproject.toml | grep -oE '[0-9.]+')
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Free disk space (two platforms of MRIQC's image, about 10 GB each unpacked)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
            /usr/local/share/boost
          docker system prune -af
          df -h /

      # The arm64 image is built under emulation: it only installs wheels on MRIQC's image.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up buildx
        run: docker buildx create --use --driver docker-container

      - name: Log in to the GitHub Container Registry
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build, and push outside pull requests
        env:
          MRIQC_VERSION: ${{ steps.pin.outputs.version }}
          REGISTRY: ghcr.io/${{ github.repository }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          export REGISTRY="${REGISTRY,,}" DATE="$(date -u +%Y%m%d)"
          # First pass: build, and read the versions the dev image recorded (amd64)
          docker buildx bake --progress plain versions
          VERSIONS="$(cat versions/versions.json)"
          export VERSIONS
          # Second pass: both platforms, with the versions as labels
          docker buildx bake --print dev | jq .target.dev.labels
          args=()
          if [[ "${{ github.event_name }}" != pull_request ]]; then
            args+=(--push)
          fi
          docker buildx bake --progress plain "${args[@]}" dev

      - name: Disk usage after the build
        if: always()
        run: df -h /
